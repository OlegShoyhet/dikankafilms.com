<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>superservice.help</title>

  <!-- Surreal elegant fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      background:
        radial-gradient(circle at top, #f6d8a8 0%, #d9a86c 25%, #6f4b34 70%, #1a1412 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      font-family:'Cormorant Garamond', serif;
    }

    /* surreal sky texture */
    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.14), transparent 20%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(0,0,0,0.18), transparent 30%);
      mix-blend-mode:screen;
      pointer-events:none;
    }

    .sun{
      position:absolute;
      width:320px;
      height:320px;
      border-radius:50%;
      background:
        radial-gradient(circle, #fff6cc 0%, #ffd27a 45%, rgba(255,180,80,0.1) 70%);
      top:8%;
      right:10%;
      filter:blur(2px);
      opacity:0.9;
    }

    /* melting landscape */
    .ground{
      position:absolute;
      bottom:-10%;
      width:120%;
      height:38%;
      background:
        linear-gradient(to top, #1b120f, #3a241b 40%, #8d5b3d);
      border-radius:45% 55% 0 0;
      filter:blur(1px);
    }

    .container{
      position:relative;
      z-index:5;
      text-align:center;
      padding:20px;
    }

    .brand{
      position:relative;
      font-family:'Cinzel', serif;
      font-size:clamp(3.5rem, 11vw, 10rem);
      color:#f7ead7;
      letter-spacing:0.08em;
      line-height:0.9;
      text-transform:lowercase;

      text-shadow:
        0 2px 0 rgba(0,0,0,0.25),
        0 8px 25px rgba(0,0,0,0.45);

      transform:skewY(-4deg);
      animation:float 7s ease-in-out infinite;
    }

    /* melting text effect */
    .brand::after{
      content:"superservice.help";
      position:absolute;
      left:0;
      top:0;
      width:100%;
      color:rgba(255,255,255,0.15);
      filter:blur(10px);
      transform:
        translateY(22px)
        scaleY(1.4)
        skewX(8deg);
      z-index:-1;
    }

    .subtitle{
      margin-top:28px;
      font-size:0.9rem;
      letter-spacing:0.45em;
      text-transform:uppercase;
      color:rgba(255,245,230,0.75);
      font-family:'Cormorant Garamond', serif;
    }

    /* surreal floating clocks */
    .clock{
      position:absolute;
      border:2px solid rgba(255,255,255,0.25);
      border-radius:50%;
      backdrop-filter:blur(3px);
      opacity:0.5;
    }

    .clock.one{
      width:120px;
      height:120px;
      left:10%;
      top:20%;
      border-radius:55% 45% 60% 40%;
      transform:rotate(25deg);
    }

    .clock.two{
      width:180px;
      height:180px;
      right:12%;
      bottom:18%;
      border-radius:40% 60% 50% 50%;
      transform:rotate(-18deg);
    }

    .clock.three{
      width:80px;
      height:80px;
      left:25%;
      bottom:22%;
      border-radius:65% 35% 45% 55%;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px) skewY(-4deg);
      }
      50%{
        transform:translateY(-10px) skewY(-4deg);
      }
    }

    @media(max-width:768px){

      .brand{
        line-height:1;
      }

      .subtitle{
        letter-spacing:0.22em;
        font-size:0.7rem;
      }

      .sun{
        width:180px;
        height:180px;
      }
    }
  </style>
</head>

<body>

  <div class="sun"></div>
  <div class="ground"></div>

  <div class="clock one"></div>
  <div class="clock two"></div>
  <div class="clock three"></div>

  <div class="container">
    <div class="brand">
      superservice.help
    </div>

    <div class="subtitle">
      surreal systems • dream logic • digital craft
    </div>
  </div>

</body>
</html>
