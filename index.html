<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dikankafilms</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@200;300;500&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#121313;
    }

    body{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;

      background:
        radial-gradient(circle at top left, rgba(94,122,128,0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(51,35,28,0.25), transparent 35%),
        linear-gradient(
          135deg,
          #161717 0%,
          #202524 25%,
          #2d3938 45%,
          #1c2120 65%,
          #35261f 100%
        );

      font-family:'Cormorant Garamond', serif;
      color:#f4f0e8;
    }

    /* moving grain texture */

    body::before{
      content:"";
      position:absolute;
      inset:-20%;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.015) 0px,
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 100px
        );

      opacity:0.45;

      animation:grainMove 18s linear infinite;

      pointer-events:none;
    }

    .orb{
      position:absolute;
      width:42vw;
      height:42vw;
      border-radius:50%;

      background:
        radial-gradient(circle,
        rgba(75,120,130,0.22) 0%,
        rgba(75,120,130,0.03) 60%,
        transparent 75%);

      filter:blur(55px);

      top:-12%;
      right:-10%;

      animation:orbFloat 18s ease-in-out infinite;
    }

    .orb2{
      position:absolute;
      width:26vw;
      height:26vw;
      border-radius:50%;

      background:
        radial-gradient(circle,
        rgba(96,28,28,0.22) 0%,
        transparent 70%);

      filter:blur(45px);

      bottom:-8%;
      left:-5%;

      animation:orbFloat2 14s ease-in-out infinite;
    }

    .container{
      position:relative;
      z-index:5;
      text-align:center;
      padding:30px;
    }

    /* blood slash */

    .slash{
      position:absolute;
      width:130%;
      height:10px;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(117,10,10,0.95),
          rgba(175,22,22,1),
          rgba(117,10,10,0.95),
          transparent
        );

      top:52%;
      left:50%;

      transform:
        translate(-50%, -50%)
        rotate(-6deg);

      box-shadow:
        0 0 20px rgba(120,0,0,0.55),
        0 0 45px rgba(120,0,0,0.25);

      opacity:0.9;

      animation:slashPulse 7s ease-in-out infinite;
    }

    .brand{
      position:relative;

      font-size:clamp(4.5rem, 14vw, 13rem);

      line-height:0.85;

      text-transform:lowercase;

      font-weight:700;

      letter-spacing:0.03em;

      color:#f5f1ea;

      z-index:2;

      animation:brandFloat 8s ease-in-out infinite;

      text-shadow:
        0 0 1px rgba(255,255,255,0.25),
        0 8px 30px rgba(0,0,0,0.55),
        0 0 80px rgba(255,255,255,0.04);
    }

    /* ghost couture layer */

    .brand::before{
      content:"dikankafilms";

      position:absolute;
      inset:0;

      color:transparent;

      -webkit-text-stroke:1px rgba(180,210,215,0.18);

      transform:
        translate(10px,10px)
        skewX(-8deg);

      animation:ghostShift 6s ease-in-out infinite;

      z-index:-1;
    }

    /* deep shadow layer */

    .brand::after{
      content:"dikankafilms";

      position:absolute;
      inset:0;

      color:rgba(120,0,0,0.18);

      transform:
        translate(-12px,-8px);

      filter:blur(6px);

      animation:ghostShift2 9s ease-in-out infinite;

      z-index:-2;
    }

    .subtitle{
      margin-top:42px;

      font-family:'Montserrat', sans-serif;

      text-transform:uppercase;

      letter-spacing:0.5em;

      font-size:0.7rem;

      color:rgba(245,240,232,0.62);

      animation:subtitleFade 6s ease-in-out infinite;
    }

    .line{
      width:220px;
      height:1px;

      margin:30px auto 0 auto;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(255,255,255,0.4),
          transparent
        );

      animation:lineExpand 5s ease-in-out infinite;
    }

    .shape{
      position:absolute;
      border:1px solid rgba(255,255,255,0.06);
      backdrop-filter:blur(4px);
    }

    .shape.one{
      width:180px;
      height:180px;

      left:7%;
      top:14%;

      transform:rotate(12deg);

      animation:shapeMove1 12s ease-in-out infinite;
    }

    .shape.two{
      width:110px;
      height:320px;

      right:10%;
      bottom:12%;

      transform:rotate(-10deg);

      animation:shapeMove2 14s ease-in-out infinite;
    }

    @keyframes brandFloat{
      0%,100%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-8px);
      }
    }

    @keyframes ghostShift{
      0%,100%{
        transform:translate(10px,10px) skewX(-8deg);
      }

      50%{
        transform:translate(18px,4px) skewX(4deg);
      }
    }

    @keyframes ghostShift2{
      0%,100%{
        transform:translate(-12px,-8px);
      }

      50%{
        transform:translate(-2px,-15px);
      }
    }

    @keyframes slashPulse{
      0%,100%{
        opacity:0.85;
        transform:translate(-50%, -50%) rotate(-6deg) scaleX(1);
      }

      50%{
        opacity:1;
        transform:translate(-50%, -50%) rotate(-6deg) scaleX(1.05);
      }
    }

    @keyframes orbFloat{
      0%,100%{
        transform:translate(0,0);
      }

      50%{
        transform:translate(-40px,30px);
      }
    }

    @keyframes orbFloat2{
      0%,100%{
        transform:translate(0,0);
      }

      50%{
        transform:translate(30px,-25px);
      }
    }

    @keyframes grainMove{
      0%{
        transform:translateX(0px);
      }

      100%{
        transform:translateX(100px);
      }
    }

    @keyframes subtitleFade{
      0%,100%{
        opacity:0.45;
      }

      50%{
        opacity:1;
      }
    }

    @keyframes lineExpand{
      0%,100%{
        width:220px;
        opacity:0.45;
      }

      50%{
        width:280px;
        opacity:1;
      }
    }

    @keyframes shapeMove1{
      0%,100%{
        transform:rotate(12deg) translateY(0px);
      }

      50%{
        transform:rotate(18deg) translateY(-18px);
      }
    }

    @keyframes shapeMove2{
      0%,100%{
        transform:rotate(-10deg) translateY(0px);
      }

      50%{
        transform:rotate(-4deg) translateY(20px);
      }
    }

    @media(max-width:768px){

      .brand{
        font-size:4.8rem;
        line-height:0.95;
      }

      .subtitle{
        font-size:0.62rem;
        letter-spacing:0.28em;
      }

      .slash{
        height:6px;
      }

      .shape{
        opacity:0.4;
      }
    }

  </style>
</head>

<body>

  <div class="orb"></div>
  <div class="orb2"></div>

  <div class="shape one"></div>
  <div class="shape two"></div>

  <div class="container">

    <div class="slash"></div>

    <div class="brand">
      dikankafilms
    </div>

    <div class="line"></div>

    <div class="subtitle">
      postmodern cinema • couture motion • brutal elegance
    </div>

  </div>

</body>
</html>
